# #122: needrestart lists restarts, never performs them.
#
# apt's hook runs `needrestart -m u` after every dpkg run, and Ubuntu's patch
# makes that AUTOMATIC restarts when this key is unset - the stock state. The
# worker runs on /usr/bin/python3.12 and maps libc6 and libexpat1, so a
# security apply would restart replicator mid-apply, outside the owner's
# window, spending a start from the 6-per-2h budget. With the key set,
# needrestart prints "Disabling Ubuntu mode, explicit restart mode configured"
# and only lists. Shape from CannObserv/broker#65 and CannObserv/notifier#91.
#
# Keep `$nrconf{ui}` unset: setting it without this key forces interactive
# mode. A parse error here makes needrestart die, which the hook swallows with
# `|| true` - restarting nothing, so it fails safe.
$nrconf{restart} = 'l';
