# replicator#113. A unit keeps no more memory.low than the slice above it
# grants, and this host's cgroup2 is mounted without memory_recursiveprot, so
# at system.slice's default of 0 every MemoryLow= below it is written, reported
# by `systemctl show`, and protects nothing. The competitor is init.scope — the
# agent sessions — a root-level sibling of this slice.
#
# Must cover the sum of its children's: replicator.service 128M + tailscaled
# 128M. More buys nothing: without recursiveprot an unclaimed grant is never
# handed down. tests/test_deploy.py checks the sum here, and on the host reads
# it back from /sys/fs/cgroup.
#
# The slice is the host's, not this repo's: a unit that claims MemoryLow= here
# later needs its share added. Installed to
# /etc/systemd/system/system.slice.d/ — a copy, like all of deploy/.
[Slice]
MemoryLow=256M
