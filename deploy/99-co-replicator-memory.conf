# Memory posture for co-replicator, which runs replicator.service beside
# interactive agent sessions. Both tunables address the SAME failure mode, and
# it is not the one people expect: on CannObserv/broker (2026-09-16) nothing was
# OOM-killed — the kernel failed *atomic* allocations in tailscaled and
# ksoftirqd, and the bus was effectively down 57m48s. See replicator#99 and
# gregoryfoster/skills#295.
#
# Agent session processes inherit oom_score_adj -1000 from exe-init/sshd, so the
# OOM killer can never choose one; it takes the production service instead.
# replicator.service carries OOMScoreAdjust=-900 (#92) as its counterweight.
# tailscaled carries the same -900 (#113). MemoryLow= on both works only through
# the grant in system.slice.d/: cgroup2 is mounted without memory_recursiveprot,
# so without it they would be inert. It shields working sets from reclaim, and
# does nothing for the atomic allocations below.

# Swap is the safety net that turns a memory ceiling into a clean, survivable
# reclaim instead of allocation failures in unrelated processes. Kept at low
# swappiness so it stays a net and not a routine paging path for the worker's
# hot pages.
vm.swappiness = 10

# Reserve the kernel keeps free for atomic (non-sleeping) allocations. The
# default rescaled to only ~11 MB after the 4 -> 8 GiB resize; 64 MB gives
# network-path allocations headroom on a host whose documented outage was
# exactly this.
vm.min_free_kbytes = 65536
