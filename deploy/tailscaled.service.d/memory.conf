# replicator#113. The worker's only path to the bus: the broker is `broker` on
# the tailnet (#88), so losing tailscaled ends the bus exactly as killing the
# worker would, and a failing tailscaled was a named symptom of
# CannObserv/broker#17 (57m48s, nothing OOM-killed). Installed to
# /etc/systemd/system/tailscaled.service.d/ — a copy, like all of deploy/.
[Service]
# Below the worker's -900, so the network path outlasts its only consumer. At a
# tied adj the kernel takes whichever has the larger RSS: the worker (72) over
# tailscaled (71) on 2026-09-29, a margin tailscaled's 123 MiB peak reverses.
# The tailnet is the one to keep — a killed worker restarts into a working bus
# path, and the OnFailure= alert to notifier:9000 travels it. -950 is
# CannObserv/power-map#588's value. At the packaged 0 it read 670,
# second from the top (#112). Applies at EXEC: restart tailscaled after the
# daemon-reload — or `sudo choom -p <pid> -n -950` — and read
# /proc/<pid>/oom_score_adj; `systemctl show` reports the new value while the
# running process keeps the old one. Children inherit it, so a Tailscale SSH
# session into this node (RunSSH=true) ranks below the worker rather than at 0 —
# by fork semantics, not measured here.
OOMScoreAdjust=-950
# Measured 2026-09-24: 60 MiB RSS, but 81 MiB charged to its cgroup — what this
# protects — with a 123 MiB peak. Effective only because
# system.slice.d/replicator-memory.conf grants it; applies without a restart.
MemoryLow=128M
