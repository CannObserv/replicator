[project]
name = "replicator"
version = "0.1.0"
description = "retrieval, fingerprinting, and temporary storage layer for the Cannabis Observer cluster"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "co-core[extract]>=0.7,<0.8",
    "co-core-aio[bus]>=0.7,<0.8",
    "fastapi>=0.126.0,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5.0,<3",
    "python-json-logger>=4.0.0,<5",
    "python-ulid>=3.1.0,<4",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.scripts]
# Canonical launch name. deploy/replicator.service and docs invoke the module
# form (python -m src.worker.main); this gives the entry point a stable name if
# the module ever moves.
replicator-worker = "src.worker.main:main"

[dependency-groups]
dev = [
    "anyio>=4.0,<5",
    "fakeredis>=2.26,<3",
    "httpx>=0.27,<1",
    "pre-commit>=4.0,<5",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=7.0,<8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.16,<0.17",
    "ty",  # beta — deliberately unpinned; non-gating advisory checker
]

# cannobserv workspace packages (co-core, co-core-aio) resolve from the local
# wheelhouse, mirrored from the private GCS index gs://co-gcs-pypi by
# scripts/sync_wheelhouse.py before `uv sync`/`uv run`. Plain version floors
# above + find-links here; no hashes, because find-links locks by filename.
[tool.uv]
find-links = ["./.wheelhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration' --cov=src --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 300
timeout_method = "thread"
markers = [
    "integration: marks tests that hit live external services or a real Redis broker; excluded by default (run with -m integration)",
]
filterwarnings = [
    "error::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["skills-vendor/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B904", "PLC0415", "FAST", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ty walks the whole tree by default. skills-vendor/ is read-only third-party
# skill content — 9 of 10 diagnostics came from there, drowning the one real
# signal. Mirrors ruff's extend-exclude.
[tool.ty.src]
exclude = ["skills-vendor/"]
