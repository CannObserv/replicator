# Moves the action pins nothing else moves (#76): ci.yml pins every `uses:` to
# a commit SHA with a `# vX.Y.Z` comment, and Dependabot rewrites both. Each PR
# is gated by ci.yml; a Dependabot-triggered run is treated like a fork's, so
# on a red one read the WIF auth step first (the verdict table on #76).
# How one lands: docs/DEPLOYMENT.md -> "Dependabot".
#
# github-actions only. `uv` waits on #76's blocker 2: co-core resolves only
# from the private wheelhouse, which Dependabot's updater cannot sync
# (CannObserv/cannobserv#554). gitsubmodule (deliberate skills-vendor/ bumps)
# stays out too.
# Guarded by tests/ci/test_dependabot.py: a mistyped config stops producing
# PRs without erroring anywhere a person looks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # scans .github/workflows/
    # Generated by install-cadence.sh; a re-render reverts any bump made in it
    # (gregoryfoster/skills#373). Its pin moves with the installer.
    exclude-paths:
      - ".github/workflows/context-cadence.yml"
    schedule:
      interval: "weekly"
    # The default is 5, and past it Dependabot opens nothing and says so
    # nowhere (CannObserv/notifier#103). One PR per action; the test derives
    # the bound.
    open-pull-requests-limit: 10
    # AGENTS.md's no-issue form: "chore: bump actions/checkout from 5.1.0 to 7.0.1".
    commit-message:
      prefix: "chore"
